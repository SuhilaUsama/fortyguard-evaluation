# Project-scoped Codex config for FortyGuard.
# Codex loads .codex/config.toml only in a trusted project. Otherwise copy these tables
# into ~/.codex/config.toml.

[mcp_servers.fortyguard]
url = "https://tos-mcp.app.fortyguard.com/mcp"
bearer_token_env_var = "FORTYGUARD_API_KEY"   # the key stays in your environment, never in this file
required = true                                # fail loudly if the key is missing
tool_timeout_sec = 180

# Default "auto" mode: read-only tools (credit_balance, *_read) run; paid tools need approval.
# In `codex exec` nobody can approve, so paid calls are refused. To allow one paid tool in
# headless runs, approve it explicitly (and keep the AGENTS.md quote-and-confirm rule):
# [mcp_servers.fortyguard.tools.temperature_routing]
# approval_mode = "approve"
# [mcp_servers.fortyguard.tools.env_params]
# approval_mode = "approve"

[shell_environment_policy]
exclude = ["FORTYGUARD_API_KEY"]               # shell commands Codex runs can't read the key
